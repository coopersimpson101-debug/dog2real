name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -v
      - name: Smoke pipeline (train 3 iterations -> export -> sim-in-the-loop)
        run: |
          python scripts/build_model.py --out build/dog2real.xml
          python scripts/train.py --config configs/smoke_test.yaml --log-dir build/smoke
          python scripts/export_policy.py --checkpoint build/smoke/model_last.pt --out-dir build/exported
          python scripts/run_robot.py --sim --policy build/exported/policy.onnx --duration 4
          python scripts/motor_sysid.py --sim
