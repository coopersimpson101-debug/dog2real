# Fall recovery ("get-up") task: start in a random fallen configuration, end standing.
extends: train_walk.yaml
task: recovery

env:
  episode_length_s: 6.0
  recovery_stand_prob: 0.1       # fraction of episodes that start already standing
  recovery_settle_substeps: 250  # passive drop before the policy takes over

commands:                        # recovery always commands zero velocity
  curriculum: false
  zero_prob: 1.0
  init_ranges: {lin_vel_x: [0.0, 0.0], lin_vel_y: [0.0, 0.0], ang_vel_yaw: [0.0, 0.0]}
  max_ranges:  {lin_vel_x: [0.0, 0.0], lin_vel_y: [0.0, 0.0], ang_vel_yaw: [0.0, 0.0]}

rewards:
  # replace the walking terms wholesale
  tracking_lin_vel: 0.0
  tracking_ang_vel: 0.0
  lin_vel_z: 0.0
  orientation: 0.0
  base_height: 0.0
  feet_air_time: 0.0
  collision: 0.0
  stand_still: 0.0
  termination: 0.0
  upright: 2.0
  recovery_height: 4.0
  recovery_pose: 2.0
  ang_vel_xy: -0.02
  torques: -1.0e-4
  dof_vel: -1.0e-3
  action_rate: -0.01
  dof_pos_limits: -5.0

domain_rand:
  push: {enabled: false}
